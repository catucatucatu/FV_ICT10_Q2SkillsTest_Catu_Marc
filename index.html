<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script><title>ICT 10</title>
    <style>
        body{
            margin: 20px;
        }
        h1{
            color: seagreen;
        }

        .result_border{
            border: 5px solid seagreen;
            border-radius: 15px;
            background-color: #d4ffdf;
            width: 100%;
        }
        #bordered{
            border: 5px solid seagreen;
            background-color: #b3ffc6;
            margin: 10px;
        }
        
    </style>
</head>
<body>
    <div id="bordered">
    <div class="container">
        <h1>Element(Non-Metal) Information</h1>
        <p>Enter a <b>Non-Metal Element</b> to search</p>

        <input type="text" id="element1" placeholder="Example: Carbon">
        <br><br>
        <button py-click="search_element">Search Element</button>
    </div>
    <br>
    <div class="container result_border">
    <div class="result"></div>
        <h3>Search Result</h3>
        <p><b>Element Name: </b><span id="code"> </span></p>
        <p><b>Element Symbol: </b><span id="symbol"> </span></p>
        <p><b>Order in the Periodic Table: </b><span id="order"> </span></p>
        <p><b>Atomic Mass: </b><span id="mass"> </span></p>
    </div>
    <br>
    </div>
    <script type="py" src="main.py"></script>
    
</body>
</html>
